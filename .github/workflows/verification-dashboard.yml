name: Verification dashboard

# Regenerates docs/verification/DASHBOARD.md, dashboard.json and MATURITY.md with
# scripts/verification-metrics.py (repository, GitHub issues and the latest CI artifacts of the
# nightly verification jobs) and opens or updates a pull request with the result. On a release
# tag it also measures engine coverage (cargo llvm-cov) and records a history row for the tag.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC, after the nightly jobs
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      coverage:
        description: "Also measure engine coverage with cargo llvm-cov (slow)"
        type: boolean
        default: false
      record:
        description: "Record a history row under this release name (e.g. v0.3.0)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: verification-dashboard
  cancel-in-progress: false

jobs:
  coverage:
    if: startsWith(github.ref, 'refs/tags/') || inputs.coverage
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      # engine/.cargo/config.toml links with clang + mold.
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y mold
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary (lines, functions, branches)
        working-directory: engine
        run: cargo llvm-cov --release --branch --json --summary-only --output-path ../llvm-cov-summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: llvm-cov-summary
          path: llvm-cov-summary.json
          if-no-files-found: error

  dashboard:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        if: needs.coverage.result == 'success'
        with:
          name: llvm-cov-summary
          path: cov
      - name: Fetch the release tag (to record its commit)
        if: github.ref_type == 'tag'
        run: git fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Compute metrics
        run: |
          args=()
          if [ -f cov/llvm-cov-summary.json ]; then args+=(--coverage-json cov/llvm-cov-summary.json); fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then args+=(--record "${GITHUB_REF_NAME}"); fi
          if [ -n "${{ inputs.record }}" ]; then args+=(--record "${{ inputs.record }}"); fi
          python3 -I scripts/verification-metrics.py --max-runs 20 "${args[@]}"
      - name: Open or update the pull request
        run: |
          if git diff --quiet -- docs/verification; then echo "no change"; exit 0; fi
          branch=automation/verification-dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/verification/DASHBOARD.md docs/verification/dashboard.json docs/verification/MATURITY.md
          git commit -m "docs(verification): regenerate dashboard and maturity matrix (${GITHUB_REF_NAME})"
          # The automation branch is owned by this workflow; it is rewritten on every run.
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Verification dashboard: regenerated metrics" \
              --body "Generated by .github/workflows/verification-dashboard.yml ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})) with scripts/verification-metrics.py. Review the diff of DASHBOARD.md and MATURITY.md: a level that dropped means its evidence disappeared from the verification docs."
          fi
