name: Mutants scope comparison (temporary)

# TEMPORARY, removed before merge: before/after caught counts of the mutants
# of the 2D static solver (prepare_static_2d_impl, PreparedStatic2D) with the
# solver test scope of main (before) and of this branch (after).
on:
  push:
    branches: [ci/verification-jobs]
    paths: [.github/workflows/mutants-compare.yml]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y mold
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants,nextest
      - name: Use main's mutants.sh
        if: matrix.variant == 'before'
        run: git show origin/main:scripts/mutants.sh > scripts/mutants.sh
      - name: Mutants of the 2D static solver (${{ matrix.variant }}, ${{ matrix.shard }}/4)
        env:
          MUTANTS_SCOPE: solver
        run: |
          export CARGO_INCREMENTAL=1 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C link-arg=-fuse-ld=mold"
          grep -n "tests+=" -A2 scripts/mutants.sh | head -12
          timeout --signal=INT 330m ./scripts/mutants.sh --jobs 2 --test-tool nextest \
            --re 'linear\.rs.*(prepare_static_2d_impl|PreparedStatic2D)' --shard ${{ matrix.shard }}/4 || true
          python3 scripts/mutants-summary.py mutants.out "${{ matrix.variant }} ${{ matrix.shard }}/4" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.variant }}-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore
